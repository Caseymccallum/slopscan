name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Build
        run: go build ./...
      - name: Vet
        run: go vet ./...
      - name: Test (race)
        run: go test -race -count=1 -timeout 10m ./...
      - name: govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@v1.1.4
          govulncheck ./...

  test-windows:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Build
        run: go build ./...
      - name: Test
        run: go test -count=1 -timeout 10m ./...

  # Dogfood: run the built binary against the repo's own fixture and fail
  # if the workflow cannot tell a breaking change from a clean scan - the
  # exit-code contract is a promise to CI, so CI should check it.
  dogfood:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Build the scanner
        run: go build -o slopscan ./cmd/slopscan
      - name: Scan, pin, and hold the line
        run: |
          ./slopscan scan testdata/tools.json --id fixture --db dogfood.db
          ./slopscan pin fixture --db dogfood.db
          # The same file again is a clean re-scan: exit 0, or the drift contract is broken.
          ./slopscan drift fixture --db dogfood.db
      - name: A removed tool must break the baseline (exit 3)
        run: |
          echo '{"tools":[]}' > empty.json
          # The scan of the emptied surface already fails with the rug-pull signal...
          code=0
          ./slopscan scan empty.json --id fixture --db dogfood.db || code=$?
          if [ "$code" -ne 3 ]; then
            echo "want scan to exit 3 on a breaking change, got $code"
            exit 1
          fi
          # ...and so must the standalone drift check.
          code=0
          ./slopscan drift fixture --db dogfood.db || code=$?
          if [ "$code" -ne 3 ]; then
            echo "want drift to exit 3 on a breaking change, got $code"
            exit 1
          fi
      - name: SARIF output must be a document a platform can ingest
        run: |
          # The scan exits 3 here (the empty surface broke the baseline); this step asserts
          # on the document it emitted before refusing.
          ./slopscan scan empty.json --id fixture --format sarif --db dogfood.db > report.sarif || true
          python3 - <<'EOF'
          import json
          doc = json.load(open("report.sarif"))
          assert doc["version"] == "2.1.0", doc["version"]
          run = doc["runs"][0]
          assert run["tool"]["driver"]["name"] == "slopscan"
          assert run["tool"]["driver"]["rules"], "no rules emitted"
          assert run["results"], "a broken surface must produce results"
          kinds = {r["ruleId"] for r in run["results"]}
          assert any(k.startswith("drift/") for k in kinds), kinds
          for result in run["results"]:
              assert result["level"] in ("error", "warning", "note"), result
              assert result["message"]["text"], "a result without evidence"
              assert result["locations"], "a result without a location"
          print("sarif ok:", len(run["results"]), "results")
          EOF